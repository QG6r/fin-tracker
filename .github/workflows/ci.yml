name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, tests and demo run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run tests
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Demo run with scripted menu input
        run: |
          ./gradlew run --no-daemon --console=plain -q \
            --args="examples/accounts.txt examples/transactions.txt analytics.json" < examples/demo-input.txt | tee demo-output.txt
          grep -q "2023: 3736.90" demo-output.txt
          grep -q "Food: 2" demo-output.txt
          test -s analytics.json
